name: Generate Blog Posts Index

on:
  # Run daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'

  # Run on push to blog directory for instant updates
  push:
    paths:
      - 'blog/**'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  generate-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./scripts
        run: npm install

      - name: Generate blog posts JSON
        run: node scripts/generate-blog-index.js

      - name: Commit and push blog-posts.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add blog-posts.json

          # Only commit if there are changes (new file or modifications)
          if git diff --staged --quiet; then
            echo "No changes to blog-posts.json"
          else
            git commit -m "chore: update blog posts index [skip ci]"
            git push
            echo "Successfully committed and pushed blog-posts.json"
          fi
